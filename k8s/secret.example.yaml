# Isto é só documentação do FORMATO do secret -- NUNCA aplique este
# arquivo com valores reais nem o commite preenchido (mesmo .gitignorado,
# é fácil commitar por engano). O secret de verdade é criado por comando
# (kubectl create secret ... --from-literal=...), que nunca escreve os
# valores em disco em texto claro -- ver docs/05-k8s-agentes.md.
apiVersion: v1
kind: Secret
metadata:
  name: olist-agents-secrets
  namespace: olist-agents
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-..."
  OLIST_PG_DSN: "postgresql://usuario:senha@host:5432/postgres"
  TARGET_URL: "https://olist-project.onrender.com"
  SITE_PASSWORD: ""
